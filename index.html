<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102942"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Corrida da Tabuada</title></head><body><main class="game"><header><h1>🎲 Corrida da Tabuada</h1><p id="turn" aria-live="polite"></p></header><div class="stage"><section class="board-shell"><div id="board" aria-label="Mapa do tabuleiro"><img src="assets/mapa-oficial.png" alt="Mapa da aventura, do porto ao castelo" draggable="false"><div id="pieces" aria-label="Posições dos jogadores"></div></div></section><aside class="hud"><div id="players" class="players"></div><div id="challenge" class="challenge"><p id="status" aria-live="polite">Prepare-se!</p><h2 id="question">🎯</h2><div id="options" class="options"></div><div class="controls"><button id="roll" type="button">🎲 Lançar dado</button><button id="restart" type="button">⚙️ Jogadores</button></div></div></aside></div><dialog id="setup"><h2>Quem vai jogar?</h2><label for="count">Número de jogadores</label><select id="count"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option></select><div id="roster"></div><button id="start" type="button">Começar partida</button></dialog></main><script type="module" src="app.js"></script></body></html>
